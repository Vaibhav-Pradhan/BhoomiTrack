<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Land Map - BhoomiTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        #map {
            height: 600px;
            width: 100%;
            border-radius: 12px;
        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>🌱 BhoomiTrack</h2>

        <p class="side-title">
            Land Management
        </p>


        <a href="/">
            🏠 Dashboard
        </a>


        <a href="/projects">
            📁 Projects
        </a>


        <a href="/land">
            🗺️ Land Records
        </a>


        <a href="/owners">
            👨‍🌾 Land Owners
        </a>


        <a href="/acquisition">
            📋 Acquisition
        </a>


        <a href="/compensation">
            💰 Compensation
        </a>


        <a href="/documents">
            📄 Documents
        </a>


        <a href="/map" class="active">
            🗺️ Map
        </a>


        <a href="#">
            📊 Reports
        </a>

    </div>



    <!-- MAIN CONTENT -->

    <div class="main">


        <!-- HEADER -->

        <div class="header">

            <div>

                <h1>
                    Land Acquisition Map
                </h1>

                <p>
                    View land parcels and acquisition locations
                </p>

            </div>


            <div class="admin">
                👤 Admin
            </div>

        </div>



        <!-- MAP BOX -->

        <div class="box">

            <h2>
                🗺️ Land Locations
            </h2>

            <br>

            <div id="map"></div>

        </div>


    </div>



    <!-- LEAFLET JAVASCRIPT -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>



    <script>

        // =========================================
        // CREATE MAP
        // =========================================

        var map = L.map("map").setView(
            [26.8467, 75.7873],
            7
        );



        // =========================================
        // OPEN STREET MAP
        // =========================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);



        // =========================================
        // LAND DATA FROM FLASK
        // =========================================

        var landRecords = {{ land_records|tojson }};



        // =========================================
        // ADD LAND MARKERS
        // =========================================

        landRecords.forEach(function(land) {


            // Check coordinates

            if (
                land.latitude !== null &&
                land.longitude !== null
            ) {


                // Create marker

                var marker = L.marker([
                    land.latitude,
                    land.longitude
                ]).addTo(map);



                // Popup information

                marker.bindPopup(`

                    <div>

                        <h3>
                            🌱 BhoomiTrack Land
                        </h3>

                        <hr>


                        <b>Land ID:</b>
                        ${land.land_id}

                        <br><br>


                        <b>Project ID:</b>
                        ${land.project_id}

                        <br><br>


                        <b>Survey Number:</b>
                        ${land.survey_number}

                        <br><br>


                        <b>Village:</b>
                        ${land.village}

                        <br><br>


                        <b>District:</b>
                        ${land.district}

                        <br><br>


                        <b>State:</b>
                        ${land.state}

                        <br><br>


                        <b>Area:</b>
                        ${land.area} acres

                        <br><br>


                        <b>Land Type:</b>
                        ${land.land_type}

                        <br><br>


                        <b>Acquisition Status:</b>
                        ${land.acquisition_status}

                    </div>

                `);

            }

        });


    </script>


</body>

</html>
