<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Acquisition - BhoomiTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="sidebar">

        <h2>🌱 BhoomiTrack</h2>

        <p class="side-title">
            Land Management
        </p>

        <a href="/">🏠 Dashboard</a>
        <a href="/projects">📁 Projects</a>
        <a href="/land">🗺️ Land Records</a>
        <a href="/owners">👨‍🌾 Land Owners</a>

        <a href="/acquisition" class="active">
            📋 Acquisition
        </a>

        <a href="#">💰 Compensation</a>
        <a href="#">📄 Documents</a>
        <a href="#">🗺️ Map</a>
        <a href="#">📊 Reports</a>

    </div>


    <div class="main">

        <div class="header">

            <div>

                <h1>Add Acquisition Record</h1>

                <p>
                    Track the acquisition process
                </p>

            </div>

            <div class="admin">
                👤 Admin
            </div>

        </div>


        <div class="box form-box">

            <form method="POST"
                  action="/add-acquisition">


                <label>Land ID</label>

                <input
                    type="number"
                    name="land_id"
                    placeholder="Example: 1"
                    required
                >


                <label>Notification Date</label>

                <input
                    type="date"
                    name="notification_date"
                >


                <label>Verification Date</label>

                <input
                    type="date"
                    name="verification_date"
                >


                <label>Approval Date</label>

                <input
                    type="date"
                    name="approval_date"
                >


                <label>Acquisition Date</label>

                <input
                    type="date"
                    name="acquisition_date"
                >


                <label>Current Stage</label>

                <select name="current_stage" required>

                    <option value="">
                        Select current stage
                    </option>

                    <option>Notification</option>
                    <option>Verification</option>
                    <option>Approval</option>
                    <option>Acquisition</option>
                    <option>Completed</option>

                </select>


                <label>Remarks</label>

                <textarea
                    name="remarks"
                    rows="4"
                    placeholder="Enter remarks">
                </textarea>


                <button type="submit">
                    Add Acquisition
                </button>

            </form>

        </div>

    </div>

</body>

</html>
